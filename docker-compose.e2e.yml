name: blockchain-transaction-simulator-e2e

x-app-image: &app-image
    image: ${IMAGE_NAME:-blockchain-transaction-simulator:e2e}

x-app-environment: &app-environment
    NODE_ENV: test

    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blockchain_simulator_e2e
    REDIS_URL: redis://redis:6379
    RPC_URL: http://anvil:8545

    BITCOIN_RPC_URL: http://bitcoin:18443
    BITCOIN_RPC_USER: e2e
    BITCOIN_RPC_WALLET: e2e
    BITCOIN_RPC_PASSWORD: e2e-password
    BITCOIN_NETWORK: regtest

    SOLANA_RPC_URL: http://solana:8899
    SOLANA_NETWORK: localnet

    JWT_SECRET: test-secret

    KMS_PROVIDER: ${KMS_PROVIDER}
    LOCAL_KMS_MASTER_KEY: ${LOCAL_KMS_MASTER_KEY}

services:
    postgres:
        image: postgres:16

        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: blockchain_simulator_e2e

        ports:
            - '65433:5432'

        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d blockchain_simulator_e2e']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

        volumes:
            - e2e-postgres-data:/var/lib/postgresql/data

        networks:
            - blockchain-e2e

    redis:
        image: redis:7

        ports:
            - '63790:6379'

        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s

        networks:
            - blockchain-e2e

    anvil:
        image: ghcr.io/foundry-rs/foundry:latest

        entrypoint:
            - anvil

        command:
            - --host
            - 0.0.0.0
            - --chain-id
            - '31337'

        ports:
            - '8546:8545'

        healthcheck:
            test: ['CMD', 'cast', 'chain-id', '--rpc-url', 'http://127.0.0.1:8545']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

        networks:
            - blockchain-e2e

    bitcoin:
        image: bitcoin/bitcoin:29.0

        command:
            - -regtest=1
            - -server=1
            - -txindex=1
            - -fallbackfee=0.0002
            - -rpcbind=0.0.0.0
            - -rpcallowip=0.0.0.0/0
            - -rpcuser=e2e
            - -rpcpassword=e2e-password
            - -acceptnonstdtxn=1

        ports:
            - '18443:18443'

        healthcheck:
            test:
                [
                    'CMD',
                    'bitcoin-cli',
                    '-regtest',
                    '-rpcuser=e2e',
                    '-rpcpassword=e2e-password',
                    'getblockchaininfo',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

        volumes:
            - e2e-bitcoin-data:/home/bitcoin/.bitcoin

        networks:
            - blockchain-e2e

    # NOTE: unlike `bitcoin/bitcoin` (official) and Foundry's `anvil`
    # (official), Solana Labs/Anza do not publish an official
    # solana-test-validator Docker image. `beeman/solana-test-validator`
    # is a nightly community build tracking the latest Agave release —
    # actively maintained at the time this was added, but a genuinely
    # different trust/staleness posture than the other two services here.
    # If it goes stale or disappears, this is the service to re-evaluate
    # first. See ADR-011.
    #
    # `--log` streams the validator's log to stdout — without it, a
    # crash writes only to a log file inside the ledger dir and
    # `docker compose logs` shows nothing useful (confirmed: the
    # container silently died after printing "Initializing..." until
    # this flag was added).
    #
    # `--ledger /tmp/solana-ledger`, with no volume mount: an earlier
    # version of this service mounted a named volume at `/data/ledger`
    # for persistence, which failed with a confirmed
    # `PermissionDenied (os error 13)` on the ledger lockfile — Docker
    # creates named-volume mount points as root by default, and unlike
    # Bitcoin's official image (see its entrypoint.sh chown step in its
    # own logs), this community image has no equivalent step to fix
    # ownership for whatever non-root user it runs as. `/tmp` is
    # world-writable (1777) regardless of that user, and `--reset`
    # already wipes the ledger on every startup anyway, so there was
    # nothing to persist across runs in the first place.
    #
    # `--advertised-ip 127.0.0.1`: `--bind-address 0.0.0.0` is needed so
    # sibling containers can reach the RPC port, but `--bind-address`
    # ALSO doubles as the default source for the gossip "advertised" IP
    # (confirmed against agave-validator's own cli.rs: --advertised-ip's
    # help text says its default is "the first --bind-address"), and
    # Agave panics if that value is 0.0.0.0 — confirmed via the
    # container's own panic trace (UnspecifiedIpAddr). --advertised-ip
    # (not --gossip-host, which does not exist on this command — an
    # earlier version of this fix guessed wrong) overrides just the
    # advertised value, independent of --bind-address. There is no real
    # multi-node gossip network for a single local test validator, so
    # 127.0.0.1 is a valid, standard placeholder here.
    solana:
        image: ghcr.io/beeman/solana-test-validator:latest
        security_opt:
            - seccomp:unconfined
        entrypoint:
            - /bin/sh
            - -c
        command:
            - |
                IP=$$(hostname -i | awk '{print $$1}')
                exec solana-test-validator \
                  --reset \
                  --ledger /tmp/solana-ledger \
                  --rpc-port 8899 \
                  --bind-address "$$IP"
        ports:
            - '8899:8899'
            - '8900:8900'
        healthcheck:
            test: ['CMD', 'solana', '--url', 'http://127.0.0.1:8899', 'cluster-version']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 15s
        volumes:
            - e2e-solana-data:/root/.config/solana
        networks:
            - blockchain-e2e

    migration:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: migration

        environment:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blockchain_simulator_e2e

        depends_on:
            postgres:
                condition: service_healthy

        networks:
            - blockchain-e2e

    api:
        <<: *app-image

        command: ['./scripts/start-api.prod.sh']

        environment:
            <<: *app-environment
            PRIVATE_KEY: ${PRIVATE_KEY}
            PORT: 3000

        ports:
            - '3002:3000'

        depends_on:
            migration:
                condition: service_completed_successfully
            anvil:
                condition: service_healthy
            bitcoin:
                condition: service_healthy
            solana:
                condition: service_healthy

        healthcheck:
            test: ['CMD', 'curl', '--fail', 'http://localhost:3000/api/v1/health']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 15s

        networks:
            - blockchain-e2e

    worker:
        <<: *app-image

        command: ['./scripts/start-worker.prod.sh']

        environment:
            <<: *app-environment
            PRIVATE_KEY: ${PRIVATE_KEY}
            CONFIRMATION_INTERVAL_MS: 1000
            EVENT_LISTENER_INTERVAL_MS: 250
            WORKER_METRICS_PORT: 3001

        ports:
            - '3003:3001'

        depends_on:
            migration:
                condition: service_completed_successfully
            anvil:
                condition: service_healthy
            bitcoin:
                condition: service_healthy
            solana:
                condition: service_healthy

        healthcheck:
            test: ['CMD', 'curl', '--fail', 'http://localhost:3001/health']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 15s

        networks:
            - blockchain-e2e

networks:
    blockchain-e2e:
        driver: bridge

volumes:
    e2e-postgres-data:
    e2e-bitcoin-data:
    e2e-solana-data:
