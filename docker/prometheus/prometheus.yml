global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # API metrics
  - job_name: "blockchain-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - host.docker.internal:3000


  # Confirmation worker metrics
  - job_name: "blockchain-confirmation-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3001