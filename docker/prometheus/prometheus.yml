global:
    scrape_interval: 5s
    evaluation_interval: 5s

rule_files:
    - /etc/prometheus/rules/recording-rules.yml
    - /etc/prometheus/rules/alert-rules.yml

scrape_configs:
    # API metrics
    - job_name: 'blockchain-api'
      metrics_path: /api/v1/metrics
      static_configs:
          - targets:
                - api:3000

    # Confirmation worker metrics
    - job_name: 'blockchain-confirmation-worker'
      metrics_path: /metrics
      static_configs:
          - targets:
                - worker:3001
