name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    packages: write

env:
    IMAGE_NAME: blockchain-transaction-simulator

jobs:
    release:
        name: Build Scan and Release Image
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            # ------------------------------------------------------------
            # Checkout
            # ------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # ------------------------------------------------------------
            # Version
            # ------------------------------------------------------------
            - name: Extract release version
              id: version
              shell: bash
              run: |
                  VERSION=${GITHUB_REF#refs/tags/v}

                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

                  echo "Release version: ${VERSION}"

            # ------------------------------------------------------------
            # Docker Setup
            # ------------------------------------------------------------
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            # ------------------------------------------------------------
            # Metadata
            # ------------------------------------------------------------
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

                  tags: |
                      type=raw,value=v${{ steps.version.outputs.version }}
                      type=raw,value=latest
                      type=sha,prefix=sha-

                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
                      org.opencontainers.image.version=v${{ steps.version.outputs.version }}
                      org.opencontainers.image.description=Blockchain Transaction Simulator
                      org.opencontainers.image.vendor=${{ github.repository_owner }}

            # ------------------------------------------------------------
            # Build and Push
            # ------------------------------------------------------------
            - name: Build and Push Release Image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile

                  push: true

                  tags: |
                      ${{ steps.meta.outputs.tags }}

                  labels: |
                      ${{ steps.meta.outputs.labels }}

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ------------------------------------------------------------
            # Image Digest
            # ------------------------------------------------------------
            - name: Display image digest
              shell: bash
              run: |
                  echo "Published image digest:"
                  echo "${{ steps.build.outputs.digest }}"

            # ------------------------------------------------------------
            # Install Syft
            # ------------------------------------------------------------
            - name: Install Syft
              uses: anchore/sbom-action/download-syft@v0.17.5

            # ------------------------------------------------------------
            # Generate SBOM
            # ------------------------------------------------------------
            - name: Generate SBOM
              shell: bash
              run: |
                  syft \
                    ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }} \
                    -o spdx-json \
                    > sbom.spdx.json

            # ------------------------------------------------------------
            # Upload SBOM
            # ------------------------------------------------------------
            - name: Upload SBOM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-v${{ steps.version.outputs.version }}
                  path: sbom.spdx.json

            # ------------------------------------------------------------
            # Security Scan
            # ------------------------------------------------------------
            - name: Run Trivy vulnerability scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
                  format: table
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: 1

            # ------------------------------------------------------------
            # GitHub Release
            # ------------------------------------------------------------
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate-release-notes: true

                  files: |
                      sbom.spdx.json

            # ------------------------------------------------------------
            # Cleanup
            # ------------------------------------------------------------
            - name: Logout from GHCR
              if: always()
              run: |
                  docker logout ghcr.io
