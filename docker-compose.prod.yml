name: blockchain-transaction-simulator-prod

x-app-image: &app-image
    image: ${IMAGE}

services:
    postgres:
        image: postgres:16
        container_name: blockchain-postgres-prod
        restart: unless-stopped

        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}

        volumes:
            - postgres_prod_data:/var/lib/postgresql/data

        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            - blockchain-network

    redis:
        image: redis:7
        container_name: blockchain-redis-prod
        restart: unless-stopped

        # Backs the BullMQ queues. Correctness does not depend on it
        # (ADR-004/005: Postgres is the source of truth), so it is not
        # persisted; queued jobs are re-derived after a restart.
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

        # Internal only: no published port.
        networks:
            - blockchain-network

    migration:
        <<: *app-image

        container_name: blockchain-migration-prod

        pull_policy: never

        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}

        command: ['./scripts/migrate.sh']

        depends_on:
            postgres:
                condition: service_healthy

        networks:
            - blockchain-network

    api:
        <<: *app-image

        container_name: blockchain-api-prod

        pull_policy: never

        command: ['./scripts/start-api.prod.sh']

        restart: unless-stopped

        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            RPC_URL: ${RPC_URL}
            REDIS_URL: redis://redis:6379
            # Fail the deploy, rather than silently boot on the code's
            # development default, if these are missing.
            JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.production}
            KMS_PROVIDER: ${KMS_PROVIDER:?KMS_PROVIDER must be set in .env.production (aws for production)}
            # Only read when KMS_PROVIDER=local (dev/test).
            LOCAL_KMS_MASTER_KEY: ${LOCAL_KMS_MASTER_KEY:-}
            AWS_REGION: ${AWS_REGION:-}
            # Signs admin mint transactions (src/services/mint.service.ts).
            PRIVATE_KEY: ${PRIVATE_KEY:-}
            PORT: 3000

            # Deployment metadata
            APP_VERSION: ${VERSION}
            GIT_SHA: ${GIT_SHA}
            IMAGE_DIGEST: ${IMAGE_DIGEST}
            DEPLOYMENT_ID: ${DEPLOYMENT_ID}
            DEPLOYMENT_CREATED_AT: ${CREATED_AT}

            # Tracing — points at whatever OTLP collector/vendor this
            # deployment uses (Grafana Tempo, Honeycomb, a self-hosted
            # collector, ...). Unlike docker-compose.yml (local dev), prod
            # doesn't bundle a Jaeger container — that's a docker-compose.yml
            # convenience for local trace viewing, not a production
            # observability backend. Tracing fails open if this is unset or
            # unreachable; see docs/decisions/008-tracing.md.
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
            OTEL_SERVICE_NAME: blockchain-transaction-simulator-api

        ports:
            - '3000:3000'

        # Lets RPC_URL=http://host.docker.internal:... resolve on Linux hosts.
        extra_hosts:
            - 'host.docker.internal:host-gateway'

        depends_on:
            migration:
                condition: service_completed_successfully
            redis:
                condition: service_healthy

        healthcheck:
            test: ['CMD', 'curl', '--fail', 'http://localhost:3000/api/v1/health']
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

        networks:
            - blockchain-network

    worker:
        <<: *app-image

        container_name: blockchain-worker-prod

        pull_policy: never

        command: ['./scripts/start-worker.prod.sh']

        restart: unless-stopped

        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            RPC_URL: ${RPC_URL}
            REDIS_URL: redis://redis:6379
            CONFIRMATION_INTERVAL_MS: ${CONFIRMATION_INTERVAL_MS}
            WORKER_METRICS_PORT: 3001

            # Scheduled balance drift job (docs/runbooks/balance-drift.md).
            # BALANCE_DRIFT_ENABLED=false also trips BalanceReconciliationStale.
            BALANCE_DRIFT_ENABLED: ${BALANCE_DRIFT_ENABLED:-true}
            BALANCE_DRIFT_INTERVAL_MS: ${BALANCE_DRIFT_INTERVAL_MS:-300000}
            BALANCE_DRIFT_PAGE_SIZE: ${BALANCE_DRIFT_PAGE_SIZE:-200}
            BALANCE_DRIFT_CONCURRENCY: ${BALANCE_DRIFT_CONCURRENCY:-5}

            # Deployment metadata
            APP_VERSION: ${VERSION}
            GIT_SHA: ${GIT_SHA}
            IMAGE_DIGEST: ${IMAGE_DIGEST}
            DEPLOYMENT_ID: ${DEPLOYMENT_ID}
            DEPLOYMENT_CREATED_AT: ${CREATED_AT}

            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
            OTEL_SERVICE_NAME: blockchain-transaction-simulator-worker

        # Prometheus scrapes worker:3001 over the compose network; the host
        # port is only for the deploy scripts' localhost checks.
        ports:
            - '127.0.0.1:3001:3001'

        extra_hosts:
            - 'host.docker.internal:host-gateway'

        depends_on:
            migration:
                condition: service_completed_successfully
            redis:
                condition: service_healthy

        healthcheck:
            test: ['CMD', 'curl', '--fail', 'http://localhost:3001/health']
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

        networks:
            - blockchain-network

    prometheus:
        image: prom/prometheus:v3.0.0
        container_name: blockchain-prometheus-prod

        restart: unless-stopped

        # The Prometheus UI/API has no auth: reach it via SSH tunnel or a
        # reverse proxy that adds auth, not the public interface.
        ports:
            - '127.0.0.1:9090:9090'

        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            # prometheus.yml's rule_files point at /etc/prometheus/rules/*.
            # Without this mount Prometheus loads zero rules and no alert
            # ever evaluates. (docker-compose.yml, for dev, mounts the same.)
            - ./monitoring:/etc/prometheus/rules:ro
            - prometheus_prod_data:/prometheus

        networks:
            - blockchain-network

volumes:
    postgres_prod_data:

    prometheus_prod_data:

networks:
    blockchain-network:
        driver: bridge
