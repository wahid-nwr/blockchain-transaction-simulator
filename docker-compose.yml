services:
  postgres:
    image: postgres:16
    container_name: mini-tether-postgres
    environment:
      POSTGRES_USER: tether
      POSTGRES_PASSWORD: tether
      POSTGRES_DB: mini_tether
    ports:
      - "65432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: